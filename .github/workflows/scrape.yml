name: Scheduled Scrape

# Runs the scrapers with nobody watching. When a target site changes and the
# data comes back wrong, ensure() repairs the scraper and runs it again in the
# same job - so the run history below is the evidence that self-healing works
# unattended, not just on demand.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: >-
          Check one domain right now instead of running the full schedule
          (e.g. news.ycombinator.com). Leave empty to run every scraper, same
          as the schedule does.
        required: false

# The default GITHUB_TOKEN is read-only. Without this the run succeeds and the
# push at the end silently fails, losing the history this workflow exists for.
permissions:
  contents: write

# A heal can take ten minutes. Overlapping runs would fight over registry.json.
concurrency:
  group: scheduled-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brightdata-mcp-studio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check one domain now
        if: ${{ github.event.inputs.domain != '' }}
        env:
          API_TOKEN: ${{ secrets.BRIGHTDATA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node scripts/check-now.js "${{ github.event.inputs.domain }}"

      - name: Run every scraper
        if: ${{ github.event.inputs.domain == '' }}
        env:
          API_TOKEN: ${{ secrets.BRIGHTDATA_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: node scripts/cron.js

      - name: Commit registry
        if: always()
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brightdata-mcp-studio/registry.json
          # Absent only if every scraper failed. git add errors on a path that
          # does not exist, which would fail the run for the wrong reason.
          if [ -d brightdata-mcp-studio/data ]; then
            git add brightdata-mcp-studio/data
          fi
          if git diff --staged --quiet; then
            echo "Registry unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "chore: scraped data and registry update [skip ci]"
          # A commit landing on main mid-run would reject this push and lose the
          # run's history. Rebase on top of it and then push.
          git pull --rebase origin main
          git push
